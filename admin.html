<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Admin | The Weekly Trivia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .admin { max-width: 980px; margin: 0 auto; padding: 24px 20px 60px; }
    .login { max-width: 380px; margin: 60px auto; background: #fff; padding: 28px; border-radius: 22px; box-shadow: 0 10px 30px rgba(29,43,79,.1); }
    .login h2 { font-size: 28px; }
    .login input { width: 100%; font: inherit; padding: 10px 12px; border-radius: 12px; border: 2px solid rgba(29,43,79,.15); margin: 14px 0 10px; }
    .btn { font: inherit; font-weight: 800; padding: 10px 16px; border-radius: 12px; border: 2px solid var(--ink); background: #fff; color: var(--ink); cursor: pointer; text-decoration: none; display: inline-block; }
    .btn.primary { background: var(--ink); color: #fff; }
    .btn.go { background: #22b573; border-color: #22b573; color: #fff; }
    .btn.warn { border-color: #ef4f5f; color: #ef4f5f; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .err { color: #ef4f5f; font-weight: 700; min-height: 1.4em; margin: 0; }
    .hero-card { background: linear-gradient(135deg, #1d2b4f, #344a85); color: #fff; border-radius: 22px; padding: 24px 26px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
    .hero-card h2 { font-size: 26px; }
    .hero-card p { margin: 4px 0 0; opacity: .9; }
    .hero-card .btn.go { font-size: 18px; padding: 14px 22px; margin-left: auto; }
    .list { display: grid; gap: 12px; margin-top: 24px; }
    .row { display: grid; grid-template-columns: 8px 1fr auto; gap: 16px; align-items: center; background: #fff; border-radius: 16px; padding: 14px 18px 14px 0; box-shadow: 0 4px 14px rgba(29,43,79,.06); overflow: hidden; }
    .row .bar { align-self: stretch; background: var(--c); }
    .row h4 { font-family: "Baloo 2"; font-size: 19px; margin: 0; }
    .row small { color: var(--muted); font-weight: 700; }
    .row .bq { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .row .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .row .actions .btn { padding: 7px 12px; font-size: 14px; }
    .chip { display: inline-block; font-size: 12px; font-weight: 800; padding: 2px 10px; border-radius: 999px; margin-left: 8px; vertical-align: middle; }
    .chip.live { background: #22b573; color: #fff; }
    .chip.rel { background: #e6f7ef; color: #16795f; }
    .chip.next { background: #ffd23f; color: var(--ink); }
    .chip.sched { background: #eef1f7; color: var(--muted); }
    .month { font-family: "Baloo 2"; font-size: 22px; margin: 18px 0 -2px; }
    @media (max-width: 640px) { .row { grid-template-columns: 8px 1fr; } .row .actions { grid-column: 2; justify-content: flex-start; } }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="brand">
      <div class="brand-logos">
        <img src="images/fit-logo.png" alt="Fitness In Time" class="logo-fit" onerror="this.remove()" />
        <img src="images/clinical-tower-logo.png" alt="Clinical Tower" class="logo-ct" onerror="this.remove()" />
      </div>
      <div>
        <h1>Weekly Trivia Admin</h1>
        <p>Release issues to your readers</p>
      </div>
    </div>
    <nav><a href="index.html" target="_blank">View live site</a></nav>
    <button id="logout" class="export-btn hidden">Log out</button>
  </header>

  <main class="admin">
    <form id="login" class="login hidden">
      <h2>Admin login</h2>
      <p id="loginHint" style="color:var(--muted);margin:4px 0 0">Enter the password from <code>admin-password.txt</code>.</p>
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required />
      <p id="loginErr" class="err"></p>
      <button class="btn primary" style="width:100%">Log in</button>
    </form>

    <section id="panel" class="hidden">
      <div id="hero" class="hero-card"></div>
      <div id="list" class="list"></div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="data.js"></script>
  <script src="admin.js"></script>
</body>
</html>
